<style>
	:root {
		--page-background: #fafaf9;
		--page-text: #404040;
		--flower-blue: #12355b;
		--soft-white: rgba(255, 255, 255, 0.72);
		--privacy-border: rgba(18, 53, 91, 0.2);
	}

	body {
		background-color: var(--page-background);
		color: var(--page-text);
		transition: background-color 0.35s ease, color 0.35s ease;
	}

	.home-content {
		position: relative;
		z-index: 1;
		overflow: hidden;
		padding: 20px 12px 70px;
	}

	.flower-pattern {
		position: absolute;
		z-index: -1;
		inset: 0;
		display: grid;
		grid-template-columns: repeat(6, 1fr);
		align-items: center;
		justify-items: center;
		color: var(--flower-blue);
		opacity: 0.1;
		font-size: 1.5rem;
		line-height: 1;
		pointer-events: none;
	}

	.flower-pattern span:nth-child(even) {
		transform: translateY(26px);
	}

	.site-title {
		margin-top: 0;
		margin-bottom: 12px;
		color: var(--flower-blue);
		text-align: center;
	}

	h1, h2, h3, h4, h5, h6 {
		color: var(--flower-blue);
	}

	.title-rule {
		width: 100%;
		margin: 0;
		border: 0;
		border-top: 4px solid var(--page-text);
	}

	.about-button {
		display: block;
		width: fit-content;
		margin: 24px auto 0;
		padding: 7px 14px;
		border: 1px solid var(--flower-blue);
		border-radius: 0;
		background-color: var(--flower-blue);
		color: #fff;
		cursor: pointer;
		text-decoration: none;
	}

	.about-buttons {
		display: flex;
		justify-content: center;
		gap: 12px;
	}

	.social-links {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		align-items: center;
		gap: 20px;
		margin-top: 24px;
		text-align: center;
	}

	.social-links a {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		width: 48px;
		height: 48px;
		border-radius: 50%;
		background-color: var(--flower-blue);
		color: var(--page-background);
		font-size: 1.5rem;
		transition: transform 0.2s ease, box-shadow 0.2s ease;
	}

	.social-links a:hover,
	.social-links a:focus-visible {
		transform: translateY(-3px);
		box-shadow: 0 6px 14px rgba(18, 53, 91, 0.24);
	}

	.language-switcher {
		position: fixed;
		top: 20px;
		left: 20px;
		z-index: 10;
		display: flex;
		gap: 6px;
	}

	.language-switcher a {
		padding: 6px 9px;
		border: 1px solid var(--flower-blue);
		color: var(--flower-blue);
		font-size: 0.8rem;
		text-decoration: none;
	}

	.privacy-notice {
		max-width: 620px;
		margin: 56px auto 0;
		padding: 16px 18px;
		border: 1px solid var(--privacy-border);
		background: var(--soft-white);
		color: var(--page-text);
		font-size: 0.9rem;
		text-align: center;
	}

	.privacy-notice p {
		margin: 0 0 12px;
	}

	.privacy-notice button {
		border: 1px solid var(--flower-blue);
		background: var(--flower-blue);
		color: var(--page-background);
		cursor: pointer;
		padding: 7px 14px;
	}

	.privacy-notice.is-hidden {
		display: none;
	}

	.page-loader {
		position: fixed;
		inset: 0;
		z-index: 1000;
		display: flex;
		align-items: center;
		justify-content: center;
		background: rgba(255, 255, 255, 0.82);
		transition: opacity 0.45s ease, visibility 0.45s ease;
	}

	.page-loader.is-hidden {
		visibility: hidden;
		opacity: 0;
	}

	.flower-spinner {
		position: relative;
		width: 74px;
		height: 74px;
		animation: spin 2.4s linear infinite;
	}

	.flower-spinner span {
		position: absolute;
		top: 50%;
		left: 50%;
		color: var(--flower-blue);
		font-size: 1.35rem;
		opacity: 0.32;
		transform: rotate(calc(var(--flower-position) * 45deg)) translateY(-28px);
		transform-origin: center 28px;
	}

	.flower-spinner span:nth-child(1) { --flower-position: 0; }
	.flower-spinner span:nth-child(2) { --flower-position: 1; }
	.flower-spinner span:nth-child(3) { --flower-position: 2; }
	.flower-spinner span:nth-child(4) { --flower-position: 3; }
	.flower-spinner span:nth-child(5) { --flower-position: 4; }
	.flower-spinner span:nth-child(6) { --flower-position: 5; }
	.flower-spinner span:nth-child(7) { --flower-position: 6; }
	.flower-spinner span:nth-child(8) { --flower-position: 7; }

	@keyframes spin {
		to { transform: rotate(360deg); }
	}

	@media (max-width: 600px) {
		.language-switcher {
			top: 12px;
			left: 12px;
		}

		.social-links {
			gap: 14px;
		}
	}
</style>

</div>

</main>

<script>
	const pageLoader = document.getElementById('page-loader');
	const privacyNotice = document.getElementById('privacy-notice');
	const privacyClose = document.getElementById('privacy-close');

	privacyClose.addEventListener('click', () => {
		privacyNotice.classList.add('is-hidden');
	});

	window.addEventListener('load', () => {
		pageLoader.classList.add('is-hidden');
	});
</script>
